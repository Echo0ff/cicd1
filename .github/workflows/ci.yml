name: V3 - 极速云原生流水线 (Registry)

on:
  push:
    branches: [ "main" ]

jobs:
  # 阶段一：构建并推送镜像
  build-and-push:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v4

      - name: 运行单元测试
        run: |
          pip install -r requirements.txt
          pytest test_main.py

      - name: 登录腾讯云镜像库
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.TENCENT_REGISTRY_URL }}
          username: ${{ vars.TENCENT_REGISTRY_USER }}
          password: ${{ secrets.TENCENT_REGISTRY_PASSWORD }}

      - name: 提取版本号
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: 构建并推送镜像
        run: |
          # 拼接完整的镜像地址
          FULL_IMAGE=${{ vars.TENCENT_REGISTRY_URL }}/${{ vars.TENCENT_REGISTRY_NAMESPACE }}/fastapi-app:${{ steps.vars.outputs.sha_short }}
          docker build -t $FULL_IMAGE .
          docker push $FULL_IMAGE

  # 阶段二：SSH 远程拉取并运行
  deploy-to-server:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH 远程部署
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.TENCENT_HOST }}
          username: ${{ vars.TENCENT_USER }}
          key: ${{ secrets.TENCENT_SSH_KEY }}
          script: |
            # 【修复语法错误】：直接在脚本层声明变量，不再使用错误的 env 嵌套
            IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"
            
            echo "====== 准备拉取版本: $IMAGE_TAG ======"
            
            # 1. 登录腾讯云 Registry (服务器端也需要登录一次)
            docker login ${{ vars.TENCENT_REGISTRY_URL }} \
              --username=${{ vars.TENCENT_REGISTRY_USER }} \
              --password=${{ secrets.TENCENT_REGISTRY_PASSWORD }}
            
            # 2. 拉取最新镜像 (从腾讯云仓库到北京服务器，走国内骨干网，极快)
            FULL_IMAGE=${{ vars.TENCENT_REGISTRY_URL }}/${{ vars.TENCENT_REGISTRY_NAMESPACE }}/fastapi-app:$IMAGE_TAG
            docker pull $FULL_IMAGE
            
            # 3. 重启容器
            docker stop fastapi-prod || true
            docker rm fastapi-prod || true
            docker run -d --name fastapi-prod -p 8000:8000 --restart unless-stopped $FULL_IMAGE
            
            # 4. 清理旧镜像，防止占满磁盘
            docker image prune -f