name: V2 - 规范化构建与部署流水线

# 触发条件：只有代码推送到 main 分支时才执行
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    # 【核心进阶】：指定运行环境为 production，流水线会去这里找我们配置好的变量和机密
    environment: production 
    
    steps:
      # Step 1: 检出最新代码
      - name: 检出代码
        uses: actions/checkout@v4

      # Step 2: 极速运行内存级单元测试 (验证 FastAPI 逻辑)
      - name: 运行本地测试
        run: |
          pip install -r requirements.txt
          pytest test_main.py

      # Step 3: 构建 Docker 镜像
      - name: 构建 Docker 镜像
        run: |
          # 打包镜像并命名为 mvp-app:latest
          docker build -t mvp-app:latest .
          # 将镜像导出为 tar 压缩包，方便传输
          docker save -o mvp-app.tar mvp-app:latest

      # Step 4: 通过 SCP 将压缩包传输到腾讯云
      - name: SCP 传输镜像包到服务器
        uses: appleboy/scp-action@master
        with:
          # 【规范使用】：IP 和 用户名是明文，从 vars 获取
          host: ${{ vars.TENCENT_HOST }}
          username: ${{ vars.TENCENT_USER }}
          # 【规范使用】：私钥是机密，从 secrets 获取
          key: ${{ secrets.TENCENT_SSH_KEY }}
          source: "mvp-app.tar"
          target: "/root/"

      # Step 5: SSH 登录服务器执行部署脚本
      - name: SSH 登录并重启 Docker 容器
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.TENCENT_HOST }}
          username: ${{ vars.TENCENT_USER }}
          key: ${{ secrets.TENCENT_SSH_KEY }}
          script: |
            echo "====== 开始在腾讯云部署 ======"
            cd /root
            
            # 1. 加载刚传过来的镜像包
            docker load -i mvp-app.tar
            
            # 2. 停止并删除旧容器 (如果存在的话，避免端口冲突)
            docker stop my-mvp-app || true
            docker rm my-mvp-app || true
            
            # 3. 启动新容器，并演示传入一个环境变量
            docker run -d \
              --name my-mvp-app \
              -p 8000:8000 \
              --restart unless-stopped \
              -e APP_ENV="Production_V2_Running" \
              mvp-app:latest
            
            # 4. 清理服务器上的压缩包，释放磁盘空间
            rm mvp-app.tar
            echo "====== 部署完成！ ======"